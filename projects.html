<!DOCTYPE html>
<html>
<head>
    <title>lab</title>

    <style>
        body {
            margin: 0;
            font-family: monospace;
            padding: 30px;
            color: white;

            opacity: 0;
            transition: opacity 1s ease;

            overflow: hidden;
        }

        body.loaded {
            opacity: 1;
        }

        /* VIDEO BACKGROUND */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4) contrast(1.1);
        }

        /* GLASS TERMINAL */
        .terminal {
            max-width: 900px;
            margin: auto;

            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;

            padding: 24px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .header {
            margin-bottom: 20px;
            opacity: 0.8;
            font-size: 30px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project {
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;

            background: rgba(255, 255, 255, 0.05);
        }

        .project:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }

        .name {
            font-size: 40px;
            font-weight: bold;
        }

        .url {
            font-size: 16px;
            opacity: 0.6;
            margin-top: 4px;
        }
    </style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
    <source src="bg2.mp4" type="video/mp4">
</video>

<div class="terminal">
    <div class="header">
        >lab:projects<br>
        select a project:
    </div>

    <div class="list" id="list"></div>
</div>

<script>
const projects = [
    { name: "Portfolio", url: "https://jaacck.me" },
    { name: "stemmixer", url: "https://lab.jaacck.me/stemmixer" },
];

const list = document.getElementById("list");

projects.forEach(p => {
    const item = document.createElement("div");
    item.className = "project";

    item.innerHTML = `
        <div class="name">> ${p.name}</div>
        <div class="url">${p.url}</div>
    `;

    item.onclick = () => {
        window.location.href = p.url;
    };

    list.appendChild(item);
});

window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});
</script>

</body>
</html>
