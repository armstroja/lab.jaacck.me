<!DOCTYPE html>
<html>
<head>
    <title>Project Terminal</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: #00ff88;
            font-family: monospace;
            padding: 30px;
        }

        .terminal {
            max-width: 900px;
            margin: auto;
        }

        .header {
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project {
            padding: 14px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0, 255, 136, 0.05);
        }

        .project:hover {
            background: rgba(0, 255, 136, 0.15);
            transform: translateX(5px);
        }

        .name {
            font-size: 18px;
            font-weight: bold;
        }

        .url {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
        }
    </style>
</head>

<body>

<div class="terminal">
    <div class="header">
        PROJECT TERMINAL<br>
        Select a project to open:
    </div>

    <div class="list" id="list"></div>
</div>

<script>
const projects = [
    { name: "Portfolio", url: "https://lab.jaacck.me/projects/portfolio" },
    { name: "Game Engine", url: "https://lab.jaacck.me/projects/game" },
    { name: "AI Tool", url: "https://lab.jaacck.me/projects/ai" },
    { name: "Music Visualizer", url: "https://lab.jaacck.me/projects/music" }
];

const list = document.getElementById("list");

projects.forEach(p => {
    const item = document.createElement("div");
    item.className = "project";

    item.innerHTML = `
        <div class="name">> ${p.name}</div>
        <div class="url">${p.url}</div>
    `;

    item.onclick = () => {
        window.location.href = p.url;
    };

    list.appendChild(item);
});
</script>

</body>
</html>
