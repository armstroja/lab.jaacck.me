<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Race Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    color: #fff;
    text-transform: uppercase;
  }
  #status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
    min-height: 28px;
  }
  #leader-display {
    padding: 4px 14px;
    border-radius: 4px;
    font-weight: bold;
    background: #222;
    border: 1px solid #444;
    transition: background 0.3s, border-color 0.3s;
  }
  #timer { color: #aaa; }
  #canvas-wrapper {
    position: relative;
    border: 2px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  canvas { display: block; }
  #winner-overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 3px solid #fff;
    border-radius: 12px;
    padding: 28px 44px;
    text-align: center;
    pointer-events: none;
  }
  #winner-overlay h2 { font-size: 1.4rem; color: #fff; margin-bottom: 8px; }
  #winner-name { font-size: 2.4rem; font-weight: bold; margin-bottom: 6px; }
  #winner-time { font-size: 0.9rem; color: #aaa; }
  #controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    padding: 10px 28px;
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover { background: #333; border-color: #888; }
  button:active { background: #444; }
  #legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 0.82rem;
    color: #888;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<h1>Arena Race</h1>
<div id="status-bar">
  <span id="leader-display">Press Start</span>
  <span id="timer"></span>
</div>
<div id="canvas-wrapper">
  <canvas id="c" width="800" height="800"></canvas>
  <div id="winner-overlay">
    <h2>Winner!</h2>
    <div id="winner-name"></div>
    <div id="winner-time"></div>
  </div>
</div>
<div id="controls">
  <button id="btn-start">Start Race</button>
  <button id="btn-restart">New Race</button>
</div>
<div id="legend"></div>

<script>
const CANVAS_W = 800, CANVAS_H = 800;
const RACER_R = 18;
const SPEED = 2.4;
const WALL_T = 10; // barrier thickness (visual only, collision uses segments)

const RACERS_DEF = [
  { name: 'Red',    color: '#ff4444' },
  { name: 'Blue',   color: '#4488ff' },
  { name: 'Green',  color: '#44dd66' },
  { name: 'Gold',   color: '#ffcc00' },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const leaderEl = document.getElementById('leader-display');
const timerEl = document.getElementById('timer');
const winnerOverlay = document.getElementById('winner-overlay');
const winnerName = document.getElementById('winner-name');
const winnerTime = document.getElementById('winner-time');

let barriers, finish, racers, state, startTime, raf;

// ── Barrier generation ───────────────────────────────────────────────────────
// 5 barriers, each a horizontal or vertical wall spanning ~60–75% of the arena
// with a small gap (just wide enough for one racer) at a random position.

function buildBarriers() {
  const W = CANVAS_W, H = CANVAS_H;
  const margin = 60;          // stay away from edges
  const GAP = RACER_R * 2.8; // gap width — tight but passable

  // Fixed layout: 5 evenly-spaced barriers alternating H/V
  // Positions are randomised within bands to vary each race.
  const defs = [
    // [axis, band-center, span-start, span-end]
    { axis: 'h', y: H * 0.20 + rand(-30, 30) },
    { axis: 'v', x: W * 0.30 + rand(-30, 30) },
    { axis: 'h', y: H * 0.45 + rand(-30, 30) },
    { axis: 'v', x: W * 0.70 + rand(-30, 30) },
    { axis: 'h', y: H * 0.72 + rand(-30, 30) },
  ];

  const segs = [];
  const rects = []; // for drawing

  for (const d of defs) {
    if (d.axis === 'h') {
      const x1 = margin, x2 = W - margin;
      // gap center somewhere along the wall, away from the edges
      const gapCx = margin + GAP + Math.random() * (x2 - x1 - 2 * GAP);
      const gapL = gapCx - GAP / 2;
      const gapR = gapCx + GAP / 2;
      const y = d.y;
      // left segment
      if (gapL > x1 + 1) {
        segs.push({ x1, y1: y, x2: gapL, y2: y });
        rects.push({ x: x1, y: y - WALL_T/2, w: gapL - x1, h: WALL_T });
      }
      // right segment
      if (gapR < x2 - 1) {
        segs.push({ x1: gapR, y1: y, x2, y2: y });
        rects.push({ x: gapR, y: y - WALL_T/2, w: x2 - gapR, h: WALL_T });
      }
    } else {
      const y1 = margin, y2 = H - margin;
      const gapCy = margin + GAP + Math.random() * (y2 - y1 - 2 * GAP);
      const gapT = gapCy - GAP / 2;
      const gapB = gapCy + GAP / 2;
      const x = d.x;
      if (gapT > y1 + 1) {
        segs.push({ x1: x, y1, x2: x, y2: gapT });
        rects.push({ x: x - WALL_T/2, y: y1, w: WALL_T, h: gapT - y1 });
      }
      if (gapB < y2 - 1) {
        segs.push({ x1: x, y1: gapB, x2: x, y2 });
        rects.push({ x: x - WALL_T/2, y: gapB, w: WALL_T, h: y2 - gapB });
      }
    }
  }

  return { segs, rects };
}

function rand(a, b) { return a + Math.random() * (b - a); }

// ── Finish zone ──────────────────────────────────────────────────────────────

function pickFinish() {
  const size = 54;
  const margin = 80;
  const x = margin + Math.random() * (CANVAS_W - 2 * margin - size);
  const y = margin + Math.random() * (CANVAS_H - 2 * margin - size);
  return { x, y, w: size, h: size };
}

// ── Collision helpers ────────────────────────────────────────────────────────

function circleSegmentCollide(px, py, vx, vy, seg) {
  const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return null;
  let t = ((px - seg.x1)*dx + (py - seg.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = seg.x1 + t*dx, cy = seg.y1 + t*dy;
  const ex = px - cx, ey = py - cy;
  const dist = Math.sqrt(ex*ex + ey*ey);
  if (dist >= RACER_R || dist < 0.001) return null;
  const nx = ex / dist, ny = ey / dist;
  const dot = vx*nx + vy*ny;
  if (dot >= 0) return null;
  const newVx = vx - 2*dot*nx;
  const newVy = vy - 2*dot*ny;
  const overlap = RACER_R - dist;
  return { x: px + nx*(overlap+0.5), y: py + ny*(overlap+0.5), vx: newVx, vy: newVy };
}

function resolveRacerCollision(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist === 0 || dist > 2*RACER_R) return;
  const nx = dx/dist, ny = dy/dist;
  const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
  const dot = relVx*nx + relVy*ny;
  if (dot < 0) return;
  a.vx -= dot*nx; a.vy -= dot*ny;
  b.vx += dot*nx; b.vy += dot*ny;
  const overlap = (2*RACER_R - dist)/2 + 0.5;
  a.x -= nx*overlap; a.y -= ny*overlap;
  b.x += nx*overlap; b.y += ny*overlap;
}

// ── Racer spawning ───────────────────────────────────────────────────────────

function spawnRacer(def, f) {
  let x, y;
  for (let i = 0; i < 300; i++) {
    x = RACER_R + Math.random() * (CANVAS_W - 2*RACER_R);
    y = RACER_R + Math.random() * (CANVAS_H - 2*RACER_R);
    const dx = x - (f.x + f.w/2), dy = y - (f.y + f.h/2);
    if (Math.sqrt(dx*dx + dy*dy) > 120) break;
  }
  const angle = Math.random() * Math.PI * 2;
  return { ...def, x, y, vx: Math.cos(angle)*SPEED, vy: Math.sin(angle)*SPEED, trail: [] };
}

// ── Draw ─────────────────────────────────────────────────────────────────────

function drawBarriers() {
  ctx.fillStyle = '#222';
  for (const r of barriers.rects) {
    // rounded-ish caps
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, WALL_T / 2);
    ctx.fill();
  }
}

function drawFinish(f) {
  const sq = 9;
  ctx.save();
  ctx.beginPath();
  ctx.rect(f.x, f.y, f.w, f.h);
  ctx.clip();
  for (let gy = f.y; gy < f.y + f.h; gy += sq) {
    for (let gx = f.x; gx < f.x + f.w; gx += sq) {
      const even = ((((gy - f.y)/sq)|0) + (((gx - f.x)/sq)|0)) % 2 === 0;
      ctx.fillStyle = even ? '#ffffff' : '#111111';
      ctx.fillRect(gx, gy, sq, sq);
    }
  }
  ctx.restore();
  ctx.strokeStyle = '#ffdd00';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(f.x, f.y, f.w, f.h);
}

function drawRacers() {
  for (const r of racers) {
    if (r.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(r.trail[0].x, r.trail[0].y);
      for (let i = 1; i < r.trail.length; i++) ctx.lineTo(r.trail[i].x, r.trail[i].y);
      ctx.strokeStyle = r.color + '44';
      ctx.lineWidth = RACER_R * 0.9;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(r.x, r.y, RACER_R, 0, Math.PI * 2);
    ctx.fillStyle = r.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function render() {
  ctx.fillStyle = '#f5f5f0';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  // arena border
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, CANVAS_W - 3, CANVAS_H - 3);
  drawFinish(finish);
  drawBarriers();
  drawRacers();
}

// ── Game loop ────────────────────────────────────────────────────────────────

const TRAIL_MAX = 30;

function init() {
  barriers = buildBarriers();
  finish = pickFinish();
  racers = RACERS_DEF.map(d => spawnRacer(d, finish));
  state = 'idle';
  winnerOverlay.style.display = 'none';
  leaderEl.textContent = 'Press Start';
  leaderEl.style.background = '#222';
  leaderEl.style.color = '#eee';
  leaderEl.style.borderColor = '#444';
  timerEl.textContent = '';
  render();
  buildLegend();
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = racers.map(r =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${r.color}"></div>
      ${r.name}
    </div>`
  ).join('');
}

function step() {
  if (state !== 'running') return;
  const elapsed = (Date.now() - startTime) / 1000;
  timerEl.textContent = elapsed.toFixed(2) + 's';

  for (const r of racers) {
    r.x += r.vx;
    r.y += r.vy;

    // Arena boundary
    if (r.x - RACER_R < 0)          { r.x = RACER_R;              r.vx =  Math.abs(r.vx); }
    if (r.x + RACER_R > CANVAS_W)   { r.x = CANVAS_W - RACER_R;   r.vx = -Math.abs(r.vx); }
    if (r.y - RACER_R < 0)          { r.y = RACER_R;              r.vy =  Math.abs(r.vy); }
    if (r.y + RACER_R > CANVAS_H)   { r.y = CANVAS_H - RACER_R;   r.vy = -Math.abs(r.vy); }

    // Barrier collisions
    for (const seg of barriers.segs) {
      const hit = circleSegmentCollide(r.x, r.y, r.vx, r.vy, seg);
      if (hit) { r.x = hit.x; r.y = hit.y; r.vx = hit.vx; r.vy = hit.vy; }
    }

    // Constant speed
    const spd = Math.sqrt(r.vx*r.vx + r.vy*r.vy);
    if (spd > 0.001) { r.vx = r.vx/spd * SPEED; r.vy = r.vy/spd * SPEED; }

    r.trail.push({x: r.x, y: r.y});
    if (r.trail.length > TRAIL_MAX) r.trail.shift();
  }

  // Racer–racer
  for (let i = 0; i < racers.length; i++)
    for (let j = i+1; j < racers.length; j++)
      resolveRacerCollision(racers[i], racers[j]);

  // Leader
  const fcx = finish.x + finish.w/2, fcy = finish.y + finish.h/2;
  const leader = racers.reduce((a, b) =>
    (a.x-fcx)**2+(a.y-fcy)**2 < (b.x-fcx)**2+(b.y-fcy)**2 ? a : b
  );
  leaderEl.textContent = 'Leading: ' + leader.name;
  leaderEl.style.background = leader.color + '33';
  leaderEl.style.borderColor = leader.color;
  leaderEl.style.color = leader.color;

  // Win
  for (const r of racers) {
    if (r.x >= finish.x && r.x <= finish.x + finish.w &&
        r.y >= finish.y && r.y <= finish.y + finish.h) {
      endRace(r, elapsed); return;
    }
  }

  render();
  raf = requestAnimationFrame(step);
}

function endRace(winner, elapsed) {
  state = 'done';
  render();
  winnerName.textContent = winner.name;
  winnerName.style.color = winner.color;
  winnerTime.textContent = 'Time: ' + elapsed.toFixed(2) + 's';
  winnerOverlay.style.display = 'block';
  winnerOverlay.style.borderColor = winner.color;
  leaderEl.textContent = winner.name + ' wins!';
  leaderEl.style.background = winner.color + '33';
  leaderEl.style.borderColor = winner.color;
  leaderEl.style.color = winner.color;
  timerEl.textContent = elapsed.toFixed(2) + 's';
}

btnStart.addEventListener('click', () => {
  if (state === 'running') return;
  if (state === 'done') { init(); return; }
  state = 'running';
  startTime = Date.now();
  raf = requestAnimationFrame(step);
});

btnRestart.addEventListener('click', () => {
  if (raf) cancelAnimationFrame(raf);
  init();
});

init();
</script>
</body>
</html>
