<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Race Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    color: #fff;
    text-transform: uppercase;
  }
  #status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
    min-height: 28px;
  }
  #leader-display {
    padding: 4px 14px;
    border-radius: 4px;
    font-weight: bold;
    background: #222;
    border: 1px solid #444;
    transition: background 0.3s, border-color 0.3s;
  }
  #timer { color: #aaa; }
  #canvas-wrapper {
    position: relative;
    border: 2px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  canvas { display: block; }
  #winner-overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 3px solid #fff;
    border-radius: 12px;
    padding: 28px 44px;
    text-align: center;
    pointer-events: none;
  }
  #winner-overlay h2 { font-size: 1.4rem; color: #fff; margin-bottom: 8px; }
  #winner-name { font-size: 2.4rem; font-weight: bold; margin-bottom: 6px; }
  #winner-time { font-size: 0.9rem; color: #aaa; }
  #controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    padding: 10px 28px;
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover { background: #333; border-color: #888; }
  button:active { background: #444; }
  #legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 0.82rem;
    color: #888;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<h1>Maze Race</h1>
<div id="status-bar">
  <span id="leader-display">Press Start</span>
  <span id="timer"></span>
</div>
<div id="canvas-wrapper">
  <canvas id="c" width="800" height="800"></canvas>
  <div id="winner-overlay">
    <h2>Winner!</h2>
    <div id="winner-name"></div>
    <div id="winner-time"></div>
  </div>
</div>
<div id="controls">
  <button id="btn-start">Start Race</button>
  <button id="btn-restart">New Race</button>
</div>
<div id="legend"></div>

<script>
const CANVAS_W = 800, CANVAS_H = 800;
const COLS = 20, ROWS = 20;
const CELL_W = CANVAS_W / COLS, CELL_H = CANVAS_H / ROWS;
const WALL = 4;
const RACER_R = 8;
const SPEED = 2.2;

const RACERS_DEF = [
  { name: 'Red',    color: '#ff4444' },
  { name: 'Blue',   color: '#4488ff' },
  { name: 'Green',  color: '#44dd66' },
  { name: 'Gold',   color: '#ffcc00' },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const leaderEl = document.getElementById('leader-display');
const timerEl = document.getElementById('timer');
const winnerOverlay = document.getElementById('winner-overlay');
const winnerName = document.getElementById('winner-name');
const winnerTime = document.getElementById('winner-time');

let maze, finish, racers, state, startTime, raf;
// state: 'idle' | 'running' | 'done'

// ── Maze generation (recursive backtracker) ──────────────────────────────────

function buildMaze() {
  // cells[r][c] = { top, right, bottom, left } walls as booleans
  const cells = Array.from({length: ROWS}, () =>
    Array.from({length: COLS}, () => ({ top: true, right: true, bottom: true, left: true }))
  );
  const visited = Array.from({length: ROWS}, () => new Array(COLS).fill(false));

  function carve(r, c) {
    visited[r][c] = true;
    const dirs = shuffle([
      [0, 1, 'right', 'left'],
      [0,-1, 'left',  'right'],
      [1, 0, 'bottom','top'],
      [-1,0, 'top',   'bottom'],
    ]);
    for (const [dr, dc, wa, wb] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (visited[nr][nc]) continue;
      cells[r][c][wa] = false;
      cells[nr][nc][wb] = false;
      carve(nr, nc);
    }
  }
  carve(0, 0);
  return cells;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Segment helpers ──────────────────────────────────────────────────────────

function getMazeSegments(cells) {
  // Returns array of {x1,y1,x2,y2} wall segments
  const segs = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL_W, y = r * CELL_H;
      const cell = cells[r][c];
      if (cell.top)    segs.push({x1: x, y1: y, x2: x + CELL_W, y2: y});
      if (cell.left)   segs.push({x1: x, y1: y, x2: x, y2: y + CELL_H});
      if (cell.bottom) segs.push({x1: x, y1: y + CELL_H, x2: x + CELL_W, y2: y + CELL_H});
      if (cell.right)  segs.push({x1: x + CELL_W, y1: y, x2: x + CELL_W, y2: y + CELL_H});
    }
  }
  return segs;
}

// ── Collision helpers ────────────────────────────────────────────────────────

function circleSegmentCollide(px, py, vx, vy, seg) {
  // Returns corrected {x,y,vx,vy} if collision, else null
  const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return null;

  // Project circle center onto segment
  let t = ((px - seg.x1)*dx + (py - seg.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = seg.x1 + t*dx, cy = seg.y1 + t*dy;
  const ex = px - cx, ey = py - cy;
  const dist = Math.sqrt(ex*ex + ey*ey);
  if (dist >= RACER_R || dist < 0.001) return null;

  // Normal points from segment toward circle
  const nx = ex / dist, ny = ey / dist;
  // Reflect velocity about normal
  const dot = vx*nx + vy*ny;
  if (dot >= 0) return null; // moving away already
  const newVx = vx - 2*dot*nx;
  const newVy = vy - 2*dot*ny;
  // Push out
  const overlap = RACER_R - dist;
  return {
    x: px + nx * (overlap + 0.5),
    y: py + ny * (overlap + 0.5),
    vx: newVx, vy: newVy
  };
}

function resolveRacerCollision(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist === 0 || dist > 2 * RACER_R) return;
  const nx = dx / dist, ny = dy / dist;
  const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
  const dot = relVx*nx + relVy*ny;
  if (dot < 0) return;
  // Exchange velocity along normal (equal mass elastic)
  a.vx -= dot * nx; a.vy -= dot * ny;
  b.vx += dot * nx; b.vy += dot * ny;
  // Separate
  const overlap = (2*RACER_R - dist) / 2 + 0.5;
  a.x -= nx * overlap; a.y -= ny * overlap;
  b.x += nx * overlap; b.y += ny * overlap;
}

// ── Finish zone ──────────────────────────────────────────────────────────────

function pickFinish() {
  const margin = 1;
  const col = margin + (Math.random() * (COLS - 2*margin) | 0);
  const row = margin + (Math.random() * (ROWS - 2*margin) | 0);
  return {
    x: col * CELL_W + WALL,
    y: row * CELL_H + WALL,
    w: CELL_W - 2*WALL,
    h: CELL_H - 2*WALL,
    col, row
  };
}

// ── Racer spawning ───────────────────────────────────────────────────────────

function spawnRacer(def, avoidFinish) {
  let col, row;
  for (let attempts = 0; attempts < 200; attempts++) {
    col = Math.random() * COLS | 0;
    row = Math.random() * ROWS | 0;
    if (Math.abs(col - avoidFinish.col) + Math.abs(row - avoidFinish.row) > 3) break;
  }
  const angle = Math.random() * Math.PI * 2;
  return {
    ...def,
    x: col * CELL_W + CELL_W / 2,
    y: row * CELL_H + CELL_H / 2,
    vx: Math.cos(angle) * SPEED,
    vy: Math.sin(angle) * SPEED,
    trail: [],
  };
}

// ── Draw ─────────────────────────────────────────────────────────────────────

function drawMaze(cells) {
  ctx.strokeStyle = '#000';
  ctx.lineWidth = WALL;
  ctx.lineCap = 'square';
  ctx.beginPath();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL_W, y = r * CELL_H;
      const cell = cells[r][c];
      if (cell.top)    { ctx.moveTo(x, y); ctx.lineTo(x + CELL_W, y); }
      if (cell.left)   { ctx.moveTo(x, y); ctx.lineTo(x, y + CELL_H); }
      if (cell.bottom) { ctx.moveTo(x, y + CELL_H); ctx.lineTo(x + CELL_W, y + CELL_H); }
      if (cell.right)  { ctx.moveTo(x + CELL_W, y); ctx.lineTo(x + CELL_W, y + CELL_H); }
    }
  }
  ctx.stroke();
}

function drawFinish(f) {
  // Checkered pattern
  const sq = 8;
  ctx.save();
  ctx.beginPath();
  ctx.rect(f.x, f.y, f.w, f.h);
  ctx.clip();
  for (let gy = f.y; gy < f.y + f.h; gy += sq) {
    for (let gx = f.x; gx < f.x + f.w; gx += sq) {
      const even = ((((gy - f.y) / sq) | 0) + (((gx - f.x) / sq) | 0)) % 2 === 0;
      ctx.fillStyle = even ? '#ffffff' : '#000000';
      ctx.fillRect(gx, gy, sq, sq);
    }
  }
  ctx.restore();
  // Glow border
  ctx.strokeStyle = '#ffdd00';
  ctx.lineWidth = 2;
  ctx.strokeRect(f.x, f.y, f.w, f.h);
}

function drawRacers() {
  for (const r of racers) {
    // Trail
    if (r.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(r.trail[0].x, r.trail[0].y);
      for (let i = 1; i < r.trail.length; i++) ctx.lineTo(r.trail[i].x, r.trail[i].y);
      ctx.strokeStyle = r.color + '55';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // Body
    ctx.beginPath();
    ctx.arc(r.x, r.y, RACER_R, 0, Math.PI * 2);
    ctx.fillStyle = r.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function render() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  drawFinish(finish);
  drawMaze(maze);
  drawRacers();
}

// ── Game loop ────────────────────────────────────────────────────────────────

let segments;

function init() {
  maze = buildMaze();
  segments = getMazeSegments(maze);
  finish = pickFinish();
  racers = RACERS_DEF.map(d => spawnRacer(d, finish));
  state = 'idle';
  winnerOverlay.style.display = 'none';
  leaderEl.textContent = 'Press Start';
  leaderEl.style.background = '#222';
  leaderEl.style.color = '#eee';
  leaderEl.style.borderColor = '#444';
  timerEl.textContent = '';
  render();
  buildLegend();
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = racers.map(r =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${r.color}"></div>
      ${r.name}
    </div>`
  ).join('');
}

const TRAIL_MAX = 24;

function step() {
  if (state !== 'running') return;

  const elapsed = (Date.now() - startTime) / 1000;
  timerEl.textContent = elapsed.toFixed(2) + 's';

  // Move racers
  for (const r of racers) {
    r.x += r.vx;
    r.y += r.vy;

    // Keep on screen (canvas boundary)
    if (r.x - RACER_R < 0)          { r.x = RACER_R;          r.vx = Math.abs(r.vx); }
    if (r.x + RACER_R > CANVAS_W)   { r.x = CANVAS_W - RACER_R; r.vx = -Math.abs(r.vx); }
    if (r.y - RACER_R < 0)          { r.y = RACER_R;          r.vy = Math.abs(r.vy); }
    if (r.y + RACER_R > CANVAS_H)   { r.y = CANVAS_H - RACER_R; r.vy = -Math.abs(r.vy); }

    // Wall collisions
    for (const seg of segments) {
      const result = circleSegmentCollide(r.x, r.y, r.vx, r.vy, seg);
      if (result) {
        r.x = result.x; r.y = result.y;
        r.vx = result.vx; r.vy = result.vy;
      }
    }

    // Maintain constant speed
    const spd = Math.sqrt(r.vx*r.vx + r.vy*r.vy);
    if (spd > 0.001) { r.vx = r.vx/spd * SPEED; r.vy = r.vy/spd * SPEED; }

    // Trail
    r.trail.push({x: r.x, y: r.y});
    if (r.trail.length > TRAIL_MAX) r.trail.shift();
  }

  // Racer–racer collisions
  for (let i = 0; i < racers.length; i++) {
    for (let j = i+1; j < racers.length; j++) {
      resolveRacerCollision(racers[i], racers[j]);
    }
  }

  // Leader (closest to finish center)
  const fcx = finish.x + finish.w/2, fcy = finish.y + finish.h/2;
  let leader = racers.reduce((a, b) => {
    const da = (a.x-fcx)**2 + (a.y-fcy)**2;
    const db = (b.x-fcx)**2 + (b.y-fcy)**2;
    return da < db ? a : b;
  });
  leaderEl.textContent = 'Leading: ' + leader.name;
  leaderEl.style.background = leader.color + '33';
  leaderEl.style.borderColor = leader.color;
  leaderEl.style.color = leader.color;

  // Win check
  for (const r of racers) {
    if (r.x >= finish.x && r.x <= finish.x + finish.w &&
        r.y >= finish.y && r.y <= finish.y + finish.h) {
      endRace(r, elapsed);
      return;
    }
  }

  render();
  raf = requestAnimationFrame(step);
}

function endRace(winner, elapsed) {
  state = 'done';
  render();
  winnerName.textContent = winner.name;
  winnerName.style.color = winner.color;
  winnerTime.textContent = 'Time: ' + elapsed.toFixed(2) + 's';
  winnerOverlay.style.display = 'block';
  winnerOverlay.style.borderColor = winner.color;
  leaderEl.textContent = winner.name + ' wins!';
  leaderEl.style.background = winner.color + '33';
  leaderEl.style.borderColor = winner.color;
  leaderEl.style.color = winner.color;
  timerEl.textContent = elapsed.toFixed(2) + 's';
}

// ── Buttons ──────────────────────────────────────────────────────────────────

btnStart.addEventListener('click', () => {
  if (state === 'running') return;
  if (state === 'done') { init(); return; }
  state = 'running';
  startTime = Date.now();
  raf = requestAnimationFrame(step);
});

btnRestart.addEventListener('click', () => {
  if (raf) cancelAnimationFrame(raf);
  init();
});

// ── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
