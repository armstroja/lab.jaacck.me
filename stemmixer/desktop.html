    presets.push({name,state:serializeMix()});
    if(presets.length>20)presets.shift();
    savePresetsStore(presets);refreshPresetListUI();
    setStatus('Saved: '+name);setTimeout(()=>setStatus(''),1500);
  });
  document.getElementById('preset-list')?.addEventListener('change',e=>{
    const idx=parseInt(e.target.value);if(isNaN(idx))return;
    const presets=loadPresetsStore();if(!presets[idx])return;
    restoreMix(presets[idx].state);
    e.target.value='';
    setStatus('Loaded: '+presets[idx].name);setTimeout(()=>setStatus(''),1200);
  });
  document.getElementById('preset-del-btn')?.addEventListener('click',()=>{
    const sel=document.getElementById('preset-list');
    const idx=parseInt(sel?.value);
    if(isNaN(idx)){setStatus('Select preset to delete');setTimeout(()=>setStatus(''),1200);return;}
    const presets=loadPresetsStore();
    const name=presets[idx]?.name||'';
    presets.splice(idx,1);savePresetsStore(presets);refreshPresetListUI();
    if(sel)sel.value='';
    setStatus('Deleted: '+name);setTimeout(()=>setStatus(''),1200);
  });
})();

// ── Beat-sync loop ────────────────────────────────────────────
function beatSyncLoop(){
  const bpm=bpmVal||detectedBpm;
  if(!bpm||!duration){setStatus('No BPM — tap tempo first');setTimeout(()=>setStatus(''),1800);return;}
  const bars=parseInt(document.getElementById('beat-sync-bars')?.value||'4');
  const barDur=(60/bpm)*4;
  const liTime=(loopIn/100)*duration;
  const liBar=Math.round(liTime/barDur);
  const newInTime=liBar*barDur;
  const newOutTime=newInTime+bars*barDur;
  loopIn=Math.max(0,Math.min(99,(newInTime/duration)*100));
  loopOut=Math.min(100,Math.max(loopIn+1,(newOutTime/duration)*100));
  updateLoopUI();updateWebAudioLoop();
  if(!isLooping){isLooping=true;loopBtn.classList.add('active');loopInMk.style.display='block';loopOutMk.style.display='block';loopRegion.style.display='block';}
  flashSnap(null,'loop');
  const syncBtn=document.getElementById('beat-sync-btn');
  if(syncBtn){syncBtn.classList.add('active');setTimeout(()=>syncBtn.classList.remove('active'),600);}
  setStatus(bars+(bars===1?' bar':' bars')+' @ '+Math.round(bpm)+' bpm');
  setTimeout(()=>setStatus(''),2200);
}
document.getElementById('beat-sync-btn')?.addEventListener('click',beatSyncLoop);

// ── MIDI clock sync ───────────────────────────────────────────
let midiClockEnabled=false;
const midiClockTimes=[];
const MIDI_CLOCK_SAMPLES=48;
function onMidiClock(){
  if(!midiClockEnabled)return;
  const now=performance.now();
  midiClockTimes.push(now);
  if(midiClockTimes.length>MIDI_CLOCK_SAMPLES)midiClockTimes.shift();
  if(midiClockTimes.length>=24){
    const span=midiClockTimes[midiClockTimes.length-1]-midiClockTimes[0];
    const avgPulse=span/(midiClockTimes.length-1);
    const bpm=Math.max(20,Math.min(300,60000/(avgPulse*24)));
    bpmVal=bpm;
    const bpmDisp=document.getElementById('bpm-display');if(bpmDisp)bpmDisp.textContent=Math.round(bpm)+' bpm';
    const ind=document.getElementById('midi-clock-indicator');
    if(ind){ind.classList.add('active');clearTimeout(ind._t);ind._t=setTimeout(()=>ind.classList.remove('active'),120);}
    if(delayNode&&actx)delayNode.delayTime.setTargetAtTime(60/bpm/2,actx.currentTime,0.15);
  }
}
document.getElementById('midi-clock-btn')?.addEventListener('click',()=>{
  midiClockEnabled=!midiClockEnabled;
  document.getElementById('midi-clock-btn')?.classList.toggle('active',midiClockEnabled);
  midiClockTimes.length=0;
  if(midiClockEnabled)initMidi();
  setStatus(midiClockEnabled?'MIDI clock: listening…':'MIDI clock: off');
  setTimeout(()=>setStatus(''),1500);
});

// ── Pitch lock (quantize to key/scale) ────────────────────────
const stemPitchLock={};
const stemPitchKey={};
STEMS.forEach(s=>{stemPitchLock[s.id]=false;stemPitchKey[s.id]=null;});
const MAJOR_SEMITONES=[0,2,4,5,7,9,11];
function quantizePitchToKey(val,keyRoot){
  if(keyRoot===null||keyRoot===undefined)return Math.round(val);
  const candidates=[];
  for(let oct=-1;oct<=1;oct++)MAJOR_SEMITONES.forEach(i=>{const p=i-keyRoot+oct*12;if(p>=-7&&p<=7)candidates.push(p);});
  if(!candidates.length)return Math.round(val);
  return candidates.reduce((b,c)=>Math.abs(c-val)<Math.abs(b-val)?c:b);
}
STEMS.forEach(s=>{
  const lockBtn=document.getElementById('splock-'+s.id);
  const keyEl=document.getElementById('spkey-'+s.id);
  const pitchEl=document.getElementById('spitch-'+s.id);
  if(lockBtn)lockBtn.addEventListener('click',()=>{
    stemPitchLock[s.id]=!stemPitchLock[s.id];
    lockBtn.classList.toggle('active',stemPitchLock[s.id]);
    if(stemPitchLock[s.id]&&pitchEl){
      stemPitchKey[s.id]=keyEl?.value===''?null:parseInt(keyEl.value);
      const locked=quantizePitchToKey(stemPitchVals[s.id],stemPitchKey[s.id]);
      stemPitchVals[s.id]=locked;pitchEl.value=locked;
      const vEl=document.getElementById('spitchv-'+s.id);if(vEl)vEl.textContent=(locked>0?'+':'')+locked;
      applyPlaybackRate(s.id);
    }
  });
  if(keyEl)keyEl.addEventListener('change',()=>{
    stemPitchKey[s.id]=keyEl.value===''?null:parseInt(keyEl.value);
    if(stemPitchLock[s.id]&&pitchEl){
      const locked=quantizePitchToKey(stemPitchVals[s.id],stemPitchKey[s.id]);
      stemPitchVals[s.id]=locked;pitchEl.value=locked;
      const vEl=document.getElementById('spitchv-'+s.id);if(vEl)vEl.textContent=(locked>0?'+':'')+locked;
      applyPlaybackRate(s.id);
    }
  });
  // Capture-phase intercept: quantize before existing bubble listener sees the value
  if(pitchEl)pitchEl.addEventListener('input',e=>{
    if(!stemPitchLock[s.id])return;
    const locked=quantizePitchToKey(parseFloat(e.target.value),stemPitchKey[s.id]);
    e.target.value=locked;
  },true);
});

// ── Waveform click-to-seek ────────────────────────────────────
function enableWaveformScrub(id){
  const canvas=document.getElementById('wc-'+id);if(!canvas)return;
  canvas.classList.add('scrub-enabled');
  canvas.addEventListener('click',e=>{
    e.stopPropagation();
    if(!duration)return;
    const rect=canvas.getBoundingClientRect();
    const pct=(e.clientX-rect.left)/rect.width;
    scrubStart();scrubMove(pct*duration);scrubEnd();
  });
  canvas.addEventListener('mousemove',e=>{
    if(!waveformData[id])return;
    const rect=canvas.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    _drawWaveformPlayhead(id,pct);
  });
  canvas.addEventListener('mouseleave',()=>drawWaveformCanvas(id));
}
function _drawWaveformPlayhead(id,pct){
  const canvas=document.getElementById('wc-'+id);if(!canvas)return;
  const s=STEMS.find(x=>x.id===id);if(!s)return;
  const data=waveformData[id];if(!data)return;
  const w=canvas.width,h=canvas.height;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);
  const rgb=hexToRgb(s.acc);
  ctx.fillStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},0.2)`;
  for(let i=0;i<data.length;i++){const x=i/data.length*w,bh=data[i]*h;ctx.fillRect(x,h-bh,Math.max(1,w/data.length),bh);}
  const px=pct*w;
  ctx.strokeStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},0.85)`;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,h);ctx.stroke();
}

animate();

// ── 3D Audio Studio ────────────────────────────────────────────
(function(){
  let active=false,prevHrtf=false;
  let renderer=null,scene=null,camera=null,animId=null;
  const meshes={},positions={};
  let dragging=null; // {id,mode,startClientY,startPosY}
  let shiftDown=false;
  let raycaster=null,mouse=null,planeTarget=null,xzPlane=null;
  let labelEls={};

  const overlay=document.createElement('div');overlay.id='studio-3d-overlay';
  overlay.innerHTML=`<div id="studio-3d-bar">
    <span id="studio-3d-title">3d audio studio</span>
    <span id="studio-3d-warn">best with headphones</span>
    <span id="studio-3d-hint">drag to pan · shift+drag for elevation</span>
    <button id="studio-3d-close">esc / close</button>
  </div>
  <canvas id="studio-3d-canvas"></canvas>`;
  document.body.appendChild(overlay);

  document.getElementById('studio-3d-close').addEventListener('click',close3D);
  window.addEventListener('keydown',e=>{
    if(e.key==='Shift')shiftDown=true;
    if(e.key==='Escape'&&active){e.preventDefault();close3D();}
  });
  window.addEventListener('keyup',e=>{if(e.key==='Shift')shiftDown=false;});

  function open3D(){
    if(active||!window.THREE)return;
    active=true;
    if(!raycaster){raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();planeTarget=new THREE.Vector3();xzPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);}
    prevHrtf=hrtfMode;
    // Init positions from current spatial angles
    STEMS.forEach(s=>{
      const a=spatialAngles[s.id]||0;
      positions[s.id]={x:Math.sin(a)*3,y:0,z:-Math.cos(a)*3};
    });
    // Force HRTF on
    if(!hrtfMode){
      initCtx();
      document.getElementById('hrtf-btn')?.click();
    }
    overlay.style.display='flex';
    initScene();
    // Update HRTF positions from saved 3D positions
    STEMS.forEach(s=>apply3DPos(s.id));
  }

  function close3D(){
    if(!active)return;
    active=false;
    // Restore HRTF state
    if(!prevHrtf&&hrtfMode)document.getElementById('hrtf-btn')?.click();
    // Restore 2D pan from angles
    STEMS.forEach(s=>{
      const pos=positions[s.id];if(!pos)return;
      const a=Math.atan2(pos.x,-pos.z);spatialAngles[s.id]=normAngle(a);
      const val=applySoftCenter(pos.x/Math.max(1,Math.hypot(pos.x,pos.z))*1);
      panVals[s.id]=val;setPanDropPos(s.id,val,{syncSpatial:false});
      if(pannerNodes[s.id]&&actx)pannerNodes[s.id].pan.setTargetAtTime(val,actx.currentTime,0.08);
    });
    // Cleanup
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(renderer){renderer.dispose();renderer=null;}
    scene=null;camera=null;
    Object.values(labelEls).forEach(el=>el.remove());labelEls={};
    overlay.style.display='none';
  }

  function initScene(){
    const canvas=document.getElementById('studio-3d-canvas');
    const w=overlay.clientWidth,h=overlay.clientHeight-40;

    renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(w,h);
    renderer.setClearColor(darkModeActive?0x07070a:0x1a1a1c,1);

    scene=new THREE.Scene();
    if(darkModeActive){scene.fog=new THREE.FogExp2(0x07070a,0.025);}
    else{scene.fog=new THREE.FogExp2(0x1a1a1c,0.025);}

    camera=new THREE.PerspectiveCamera(52,w/h,0.1,80);
    camera.position.set(0,9,11);camera.lookAt(0,0,0);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff,0.3));
    const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(4,10,4);scene.add(dl);

    // Floor grid
    const grid=new THREE.GridHelper(14,14,0x333340,0x1e1e28);
    grid.material.transparent=true;grid.material.opacity=0.55;scene.add(grid);

    // Listener marker at origin
    const lGeo=new THREE.SphereGeometry(0.14,10,10);
    const lMat=new THREE.MeshStandardMaterial({color:0x888888,emissive:0x444444,roughness:0.4});
    const lMesh=new THREE.Mesh(lGeo,lMat);scene.add(lMesh);
    // Listener ring
    const rGeo=new THREE.RingGeometry(0.28,0.32,24);
    const rMat=new THREE.MeshBasicMaterial({color:0x666666,side:THREE.DoubleSide,transparent:true,opacity:0.4});
    const ring=new THREE.Mesh(rGeo,rMat);ring.rotation.x=-Math.PI/2;scene.add(ring);

    // Stem spheres
    Object.values(meshes).forEach(m=>scene.remove(m));
    STEMS.forEach(s=>{
      const col=new THREE.Color(s.acc);
      const geo=new THREE.SphereGeometry(0.28,18,18);
      const mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.7,roughness:0.2,metalness:0.1});
      const mesh=new THREE.Mesh(geo,mat);
      // Glow halo
      const hGeo=new THREE.SphereGeometry(0.52,12,12);
      const hMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.11,side:THREE.BackSide,depthWrite:false});
      mesh.add(new THREE.Mesh(hGeo,hMat));
      // Point light
      const pl=new THREE.PointLight(col,0.9,4);mesh.add(pl);
      // Vertical stem line to floor
      const lineMat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.25});
      const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,-0.28,0)]);
      mesh._line=new THREE.Line(lineGeo,lineMat);scene.add(mesh._line);

      const pos=positions[s.id];
      mesh.position.set(pos.x,pos.y,pos.z);
      meshes[s.id]=mesh;
      if(buffers[s.id])scene.add(mesh);

      // DOM label
      const lbl=document.createElement('div');lbl.className='studio-3d-label';lbl.textContent=s.label;
      lbl.style.color=s.acc+'bb';overlay.appendChild(lbl);labelEls[s.id]=lbl;
    });

    setupDrag(canvas);

    function render(){
      animId=requestAnimationFrame(render);
      const t=performance.now()*0.001;
      STEMS.forEach(s=>{
        const m=meshes[s.id];if(!m)return;
        const visible=!!buffers[s.id];
        if(visible&&!m.parent)scene.add(m);
        if(!visible&&m.parent)scene.remove(m);
        if(!visible)return;
        const en=stemEnergy[s.id]||0;
        const sc=1+en*0.28+Math.sin(t*2.2+STEMS.indexOf(s)*1.1)*0.018;
        m.scale.setScalar(sc);
        m.children[0].material.opacity=0.08+en*0.28;
        m.children[1].intensity=0.6+en*1.4;
        // Stem line to floor
        const pos=positions[s.id];
        if(m._line){
          const pts=[new THREE.Vector3(0,0,0),new THREE.Vector3(0,-pos.y,0)];
          m._line.geometry.setFromPoints(pts);
          m._line.position.set(pos.x,pos.y,pos.z);
        }
        // Project label to screen
        const lbl=labelEls[s.id];
        if(lbl){
          const v=m.position.clone().project(camera);
          const cx=(v.x*0.5+0.5)*overlay.clientWidth;
          const cy=(-v.y*0.5+0.5)*(overlay.clientHeight-40)+40;
          lbl.style.left=cx+'px';lbl.style.top=(cy+18)+'px';
          lbl.style.display=(v.z<1)?'block':'none';
        }
      });
      renderer.render(scene,camera);
    }
    render();

    function onResize(){
      if(!renderer)return;
      const nw=overlay.clientWidth,nh=overlay.clientHeight-40;
      camera.aspect=nw/nh;camera.updateProjectionMatrix();renderer.setSize(nw,nh);
    }
    window.addEventListener('resize',onResize);
    overlay._resizeOff=()=>window.removeEventListener('resize',onResize);
  }

  function setupDrag(canvas){
    const tmpPt=new THREE.Vector3();
    function ndcOf(e){
      const r=canvas.getBoundingClientRect();
      return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};
    }
    function hitstem(e){
      const n=ndcOf(e);mouse.set(n.x,n.y);raycaster.setFromCamera(mouse,camera);
      const obs=STEMS.filter(s=>meshes[s.id]&&buffers[s.id]).map(s=>meshes[s.id]);
      const hits=raycaster.intersectObjects(obs,true);
      if(!hits.length)return null;
      let obj=hits[0].object;
      while(obj.parent&&obj.parent!==scene)obj=obj.parent;
      return STEMS.find(s=>meshes[s.id]===obj)||null;
    }

    canvas.addEventListener('mousedown',e=>{
      if(!scene)return;
      const s=hitstem(e);if(!s)return;
      const pos=positions[s.id];
      if(shiftDown||e.shiftKey){
        dragging={id:s.id,mode:'y',startClientY:e.clientY,startPosY:pos.y};
      }else{
        xzPlane.constant=-pos.y;
        dragging={id:s.id,mode:'xz'};
      }
      canvas.style.cursor='grabbing';
    });
    canvas.addEventListener('mousemove',e=>{
      if(!scene)return;
      if(!dragging){canvas.style.cursor=hitstem(e)?'grab':'default';return;}
      const {id,mode}=dragging;const pos=positions[id];const mesh=meshes[id];if(!mesh)return;
      if(mode==='xz'){
        const n=ndcOf(e);mouse.set(n.x,n.y);raycaster.setFromCamera(mouse,camera);
        xzPlane.constant=-pos.y;
        if(raycaster.ray.intersectPlane(xzPlane,tmpPt)){
          pos.x=Math.max(-5,Math.min(5,tmpPt.x));
          pos.z=Math.max(-5,Math.min(5,tmpPt.z));
        }
      }else{
        const dy=e.clientY-dragging.startClientY;
        pos.y=Math.max(-2,Math.min(5,dragging.startPosY-dy*0.025));
      }
      mesh.position.set(pos.x,pos.y,pos.z);
      apply3DPos(id);
    });
    window.addEventListener('mouseup',()=>{dragging=null;if(canvas)canvas.style.cursor='default';},{capture:false});

    // Touch support
    canvas.addEventListener('touchstart',e=>{
      if(!scene||!e.touches.length)return;
      e.preventDefault();
      const t=e.touches[0];
      const fakeE={clientX:t.clientX,clientY:t.clientY,shiftKey:false};
      const s=hitstem(fakeE);if(!s)return;
      const pos=positions[s.id];
      xzPlane.constant=-pos.y;
      dragging={id:s.id,mode:'xz'};
    },{passive:false});
    canvas.addEventListener('touchmove',e=>{
      if(!dragging||!e.touches.length)return;
      e.preventDefault();
      const t=e.touches[0];
      const {id}=dragging;const pos=positions[id];const mesh=meshes[id];if(!mesh)return;
      const n=ndcOf({clientX:t.clientX,clientY:t.clientY});mouse.set(n.x,n.y);raycaster.setFromCamera(mouse,camera);
      xzPlane.constant=-pos.y;
      if(raycaster.ray.intersectPlane(xzPlane,tmpPt)){
        pos.x=Math.max(-5,Math.min(5,tmpPt.x));pos.z=Math.max(-5,Math.min(5,tmpPt.z));
      }
      mesh.position.set(pos.x,pos.y,pos.z);apply3DPos(id);
    },{passive:false});
    canvas.addEventListener('touchend',()=>{dragging=null;});
  }

  function apply3DPos(id){
    const pos=positions[id];
    // Update HRTF panner
    const hp=hrtfPanners[id];
    if(hp&&actx){
      const now=actx.currentTime;
      hp.positionX.setTargetAtTime(pos.x,now,0.02);
      hp.positionY.setTargetAtTime(pos.y,now,0.02);
      hp.positionZ.setTargetAtTime(pos.z,now,0.02);
    }
    // Sync 2D pan indicator
    const maxXZ=Math.max(0.01,Math.hypot(pos.x,pos.z));
    const pan2d=applySoftCenter(Math.max(-1,Math.min(1,pos.x/5)));
    panVals[id]=pan2d;
    setPanDropPos(id,pan2d,{syncSpatial:false});
    if(pannerNodes[id]&&actx)pannerNodes[id].pan.setTargetAtTime(pan2d,actx.currentTime,0.02);
  }

  // Expose open for external use
  window._open3DStudio=open3D;
})();
</script>
