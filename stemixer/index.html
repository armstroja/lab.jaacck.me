<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stem Mixer</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="description" content="Simple DAW. Intuitive audio mixer using premade stems.">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #f5f5f0;
        color: #2a2a2a;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
    }

    #art-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(circle at center, #ffffff 0%, #e2e2d5 100%);
        filter: blur(40px);
        opacity: 0.6;
        transition: transform 0.1s ease-out;
    }

    .container {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 400px;
        width: 100%;
    }

    #eq-container {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 30px;
        height: 60px;
        align-items: flex-end;
    }

    .eq-bar-large {
        width: 24px;
        border-radius: 4px;
        transition: height 0.12s ease-out, background-color 0.2s ease;
        background: #dcdcd0;
    }

    h1 {
        font-size: 10px;
        letter-spacing: .5em;
        text-transform: uppercase;
        color: #4a4a44;
        margin-bottom: 40px;
    }

    .hero-box {
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid #dcdcd0;
        border-radius: 12px;
        padding: 40px 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .enter-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 14px 26px;
        background: #2a2a2a;
        color: #f5f5f0;
        text-decoration: none;
        font-size: 9px;
        letter-spacing: .3em;
        text-transform: uppercase;
        border-radius: 30px;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        cursor: pointer;
    }

    .enter-btn:hover {
        background: #8040ff;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(128, 64, 255, 0.2);
    }

    .enter-btn.secondary {
        background: transparent;
        color: #2a2a2a;
        border: 1px solid #2a2a2a;
    }

    .enter-btn.secondary:hover {
        background: #8040ff;
        border-color: #8040ff;
        color: #f5f5f0;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(128, 64, 255, 0.2);
    }

    /* Mobile icon — small phone shape */
    .mobile-icon {
        display: inline-block;
        width: 6px;
        height: 9px;
        border: 1.2px solid currentColor;
        border-radius: 1.5px;
        flex-shrink: 0;
    }

    /* Desktop icon — small monitor shape */
    .desktop-icon {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        flex-shrink: 0;
    }
    .desktop-icon .screen {
        width: 10px;
        height: 7px;
        border: 1.2px solid currentColor;
        border-radius: 1px;
    }
    .desktop-icon .stand {
        width: 4px;
        height: 2px;
        border-left: 1.2px solid currentColor;
        border-right: 1.2px solid currentColor;
        border-bottom: 1.2px solid currentColor;
    }

    .features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 30px;
    }

    .feat-item {
        font-size: 8px;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: #8a8a80;
        padding: 10px;
        border-top: 1px solid #dcdcd0;
    }

    .feat-item.wip {
        color: #8040ff99;
    }

    /* Safari / unsupported browser warning */
    #unsupported-message {
        display: none;
        margin-top: 18px;
        font-size: 8px;
        letter-spacing: .1em;
        color: #c0392b;
        background: rgba(192, 57, 43, 0.06);
        border: 1px solid rgba(192, 57, 43, 0.2);
        border-radius: 8px;
        padding: 10px 14px;
        line-height: 1.6;
    }

    .footer-links {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .footer-links a {
        font-size: 8px;
        letter-spacing: .2em;
        text-transform: lowercase;
        color: #a0a090;
        text-decoration: none;
        transition: color 0.2s;
    }

    .footer-links a:hover {
        color: #8040ff;
    }
</style>
</head>
<body>

<div id="art-bg"></div>

<div class="container">
    <div id="eq-container">
        <div class="eq-bar-large" id="bar-0"></div>
        <div class="eq-bar-large" id="bar-1"></div>
        <div class="eq-bar-large" id="bar-2"></div>
        <div class="eq-bar-large" id="bar-3"></div>
    </div>

    <h1>Stem Mixer</h1>

    <div class="hero-box">
        <div class="btn-row">
            <a href="mobile.html" class="enter-btn">
                <span class="mobile-icon"></span>
                Mobile
            </a>
            <a href="desktop.html" class="enter-btn secondary">
                <span class="desktop-icon">
                    <span class="screen"></span>
                    <span class="stand"></span>
                </span>
                Desktop
            </a>
        </div>

        <div class="features">
            <div class="feat-item">Simple DAW</div>
            <div class="feat-item">Client-Side</div>
            <div class="feat-item wip">Under Construction</div>
            <div class="feat-item">4-Channel Split</div>
        </div>

        <p id="unsupported-message">
            This browser does not support the visual dependencies this project relies on — you may experience degraded quality.
        </p>
    </div>

    <div class="footer-links">
        <a href="license.html">license</a>
        <a href="https://github.com/armstroja/armstroja.github.io" target="_blank">git repository</a>
    </div>
</div>

<script>
    const STEM_COLORS = ['#ff0066', '#f5a623', '#00b8ff', '#20d67b'];

    STEM_COLORS.forEach((color, i) => {
        const bar = document.getElementById(`bar-${i}`);
        bar.style.backgroundColor = color + 'cc';
    });

    function animateBars() {
        STEM_COLORS.forEach((color, i) => {
            const bar = document.getElementById(`bar-${i}`);
            const randomHeight = Math.floor(Math.random() * 50) + 10;
            bar.style.height = `${randomHeight}px`;
            bar.style.backgroundColor = Math.random() > 0.8 ? color : color + 'cc';
        });
        setTimeout(animateBars, 150);
    }

    animateBars();

    window.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
        document.getElementById('art-bg').style.transform = `translate(${moveX}px, ${moveY}px) scale(1.1)`;
    });

    // Safari unsupported warning
    const ua = navigator.userAgent;
    if (ua.includes("Safari") && !ua.includes("Chrome") && !ua.includes("Chromium")) {
        document.getElementById("unsupported-message").style.display = "block";
    }
</script>

</body>
</html>
