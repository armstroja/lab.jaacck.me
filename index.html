<!DOCTYPE html>
<html>
<head>
    <title>lab</title>

    <style>
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .browse-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;

            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .browse-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline preload="auto" class="background-video">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <button class="browse-btn" id="projectsBtn"
        onclick="window.location.href='https://lab.jaacck.me/projects'">
        Browse Projects
    </button>

    <script>
        setTimeout(() => {
            document.getElementById('projectsBtn').classList.add('show');
        }, 5000);
    </script>
</body>
</html>
