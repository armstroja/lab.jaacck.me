<!DOCTYPE html>
<html>
<head>
    <title>lab</title>

    <style>
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .browse-btn {
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            z-index: 1;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline class="background-video">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <button class="browse-btn" onclick="window.location.href='https://lab.jaacck.me/projects'">
        Browse Projects
    </button>
</body>
</html>
